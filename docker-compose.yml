# Lab 5 - Plataforma propia: MQTT -> Telegraf -> InfluxDB -> Grafana
# Levantar:  docker compose up -d --build
# Todas las imágenes tienen versión ARM64 (sirven luego en la Raspberry Pi).

services:

  # 1) Broker MQTT: recibe los mensajes del publicador
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: lab5-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"            # expuesto para pruebas desde fuera de la VM
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data

  # 2) Base de datos de series de tiempo (TSDB): guarda el historial de 4 días
  influxdb:
    image: influxdb:2.7
    container_name: lab5-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 3) Puente de ingesta: se suscribe a MQTT y escribe en InfluxDB
  telegraf:
    image: telegraf:1.32
    container_name: lab5-telegraf
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  # 4) Publicador simulado con las 3 variables (corre los 4 días)
  publisher:
    build: ./publisher
    container_name: lab5-publisher
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DEVICE_ID: ${DEVICE_ID:-sensor-01}
      INTERVAL_S: ${INTERVAL_S:-10}
      TZ: America/Bogota
      OVERRIDE_FILE: /state/override.json
    volumes:
      - publisher-state:/state

  # 5) Grafana: visualización y alertas (solo LEE de InfluxDB)
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: lab5-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: America/Bogota
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

  # 6) Receptor de alertas: Grafana le hace POST (webhook) y él lo deja en el log.
  #    Es la "acción" de la alerta exigida por la guía (webhook + log).
  alert-sink:
    build: ./alert-sink
    container_name: lab5-alert-sink
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    volumes:
      - alert-log:/logs

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  publisher-state:
  grafana-data:
  alert-log:
