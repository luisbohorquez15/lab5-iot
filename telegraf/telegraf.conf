# Telegraf: puente MQTT -> InfluxDB
# Se suscribe al broker, interpreta el JSON y escribe cada mensaje como un punto.

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

# ---------- ENTRADA: MQTT ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["lab5/+/telemetry"]        # + = cualquier dispositivo
  qos = 1                              # al menos una vez
  client_id = "telegraf-lab5"
  persistent_session = true            # si Telegraf se reinicia, el broker le guarda lo pendiente
  connection_timeout = "30s"

  data_format = "json"
  name_override = "environment"        # nombre de la "tabla" (measurement) en InfluxDB
  tag_keys = ["device"]                # device se guarda como etiqueta (indexada)
  json_time_key = "ts"                 # usa la marca de tiempo REAL del publicador
  json_time_format = "unix_ms"

# ---------- SALIDA: InfluxDB 2.x ----------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
