# Alerta de umbral del Lab 5 (provisionada: queda en el repo y es reproducible)
apiVersion: 1

# 1) A DÓNDE se avisa: webhook al contenedor alert-sink (que lo escribe en un log)
contactPoints:
  - orgId: 1
    name: webhook-lab5
    receivers:
      - uid: webhook-lab5
        type: webhook
        settings:
          url: http://alert-sink:5000/alert
          httpMethod: POST
        disableResolveMessage: false

# 2) CÓMO se enruta: toda alerta va al webhook
policies:
  - orgId: 1
    receiver: webhook-lab5
    group_by: ["alertname"]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 1h

# 3) QUÉ se vigila: temperatura promedio de 2 min > 32 °C sostenida 1 min
groups:
  - orgId: 1
    name: lab5-umbral
    folder: Lab 5
    interval: 30s                 # cada cuánto se evalúa
    rules:
      - uid: lab5-temp-alta
        title: Temperatura alta (> 32 °C)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }   # ventana: últimos 2 minutos
            datasourceUid: influxdb-lab5
            model:
              refId: A
              query: |-
                from(bucket: "lab5")
                  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)
                  |> filter(fn: (r) => r._measurement == "environment" and r._field == "temperature")
                  |> group(columns: ["device"])
                  |> mean()
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [32] }
        noDataState: NoData
        execErrState: Error
        for: 1m                   # debe sostenerse 1 min antes de disparar
        labels:
          severity: warning
        annotations:
          summary: "Temperatura alta en {{ $labels.device }}"
          description: "Promedio de 2 min = {{ $values.B }} °C (umbral 32 °C)"
